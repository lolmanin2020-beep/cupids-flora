<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Garden — Cupid's Flora</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-avatar-context="gallery">

<script src="sprite-loader.js"></script>

<div class="corner-flowers corner-flowers--tl">
  <svg class="flower f-rose-lg"><use href="#flower-rose"/></svg>
</div>
<div class="corner-flowers corner-flowers--tr">
  <svg class="flower f-peony-lg"><use href="#flower-peony"/></svg>
</div>
<div class="corner-flowers corner-flowers--bl">
  <svg class="flower f-carnation-md"><use href="#flower-carnation"/></svg>
</div>
<div class="corner-flowers corner-flowers--br">
  <svg class="flower f-leaf-sm"><use href="#leaf-sprig"/></svg>
</div>

<div class="page-wrap">
  <header class="hero hero--small">
    <a class="back-link" href="index.html">← Cupid's Flora</a>
    <h1 class="script-title">Memory Garden</h1>
    <p class="tagline">every little moment, kept somewhere safe</p>
  </header>

  <main>
    <div id="gallery-tabs" class="gallery-tabs"></div>
    <div id="gallery-grid" class="gallery-grid"></div>
    <div id="gallery-empty" class="gallery-empty hidden">
      <p>The garden is still growing — memories are being planted here soon. 🌱</p>
    </div>
  </main>

  <footer class="flourish-footer">
    <p>— made with love —</p>
  </footer>
</div>

<div id="lightbox" class="lightbox hidden">
  <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
  <button id="lightbox-prev" class="lightbox-nav lightbox-nav--prev" aria-label="Previous photo">&#8249;</button>
  <img id="lightbox-img" src="" alt="A memory, enlarged" />
  <button id="lightbox-next" class="lightbox-nav lightbox-nav--next" aria-label="Next photo">&#8250;</button>
</div>

<script src="gallery.js"></script>
<script src="petals.js"></script>
<script src="avatar.js"></script>
<script src="flowers.js"></script>
</body>
</html>
