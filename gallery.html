<div class="corner-flowers corner-flowers--tl">
  <svg class="flower f-rose-lg"><use href="#flower-rose"/></svg>
</div>

</div>

<div class="page-wrap">
  <header class="hero hero--small">
    <a class="back-link" href="index.html">← Cupid's Flora</a>
    <h1 class="script-title">Memory Garden</h1>
    <p class="tagline">every little moment, kept somewhere safe</p>
  </header>

  <main>
    <div id="gallery-tabs" class="gallery-tabs"></div>
    <div id="gallery-grid" class="gallery-grid"></div>
    <div id="gallery-empty" class="gallery-empty hidden">
      <p>The garden is still growing — memories are being planted here soon. 🌱</p>
    </div>
  </main>

  <footer class="flourish-footer">

  </footer>

<div id="lightbox" class="lightbox hidden">
