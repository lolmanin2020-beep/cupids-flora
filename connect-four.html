<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect Four — Cupid's Flora</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-avatar-context="game">

<script src="sprite-loader.js"></script>

<div class="corner-flowers corner-flowers--tl">
  <svg class="flower f-rose-lg"><use href="#flower-rose"/></svg>
</div>
<div class="corner-flowers corner-flowers--tr">
  <svg class="flower f-peony-lg"><use href="#flower-peony"/></svg>
</div>
<div class="corner-flowers corner-flowers--bl">
  <svg class="flower f-carnation-md"><use href="#flower-carnation"/></svg>
</div>
<div class="corner-flowers corner-flowers--br">
  <svg class="flower f-leaf-sm"><use href="#leaf-sprig"/></svg>
</div>

<div class="page-wrap">
  <header class="hero hero--small">
    <a class="back-link" href="index.html">← Cupid's Flora</a>
    <h1 class="script-title">Connect Four</h1>
    <p class="tagline">take turns from wherever you both are</p>
  </header>

  <main class="game-wrap">
    <div id="lobby" class="ornate-panel">
      <div id="lobby-choice" class="lobby-choice">
        <button id="create-btn" class="ornate-button">Create a Game</button>
        <div class="divider-word">or</div>
        <div class="join-row">
          <input id="join-input" type="text" placeholder="Paste your invite link or code" />
          <button id="join-btn" class="ornate-button ornate-button--ghost">Join</button>
        </div>
      </div>
      <div id="share-box" class="share-box hidden">
        <p>Send this link so you can play together:</p>
        <div class="share-link-row">
          <input id="share-link" type="text" readonly />
          <button id="copy-btn" class="ornate-button ornate-button--ghost">Copy</button>
        </div>
      </div>
      <p id="lobby-status" class="status-text"></p>
    </div>

    <div id="game" class="hidden">
      <p id="turn-status" class="status-text"></p>
      <div id="board" class="board"></div>
      <div id="win-banner" class="win-banner hidden">
        <p id="win-text"></p>
        <button id="rematch-btn" class="ornate-button">Play Again</button>
      </div>
    </div>
  </main>

  <footer class="flourish-footer">
    <p>— made with love —</p>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="peer-connection.js"></script>
<script src="connect-four.js"></script>
<script src="petals.js"></script>
<script src="flowers.js"></script>
<script src="avatar.js"></script>
</body>
</html>
