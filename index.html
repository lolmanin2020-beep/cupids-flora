<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#5b0f14" />
<title>For you</title>
<meta name="description" content="A little something, just for you." />
<meta property="og:title" content="For you" />
<meta property="og:description" content="A little something, just for you." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%235b0f14'/%3E%3Cpath d='M50 77 C22 56 17 40 27 29 C36 20 47 26 50 37 C53 26 64 20 73 29 C83 40 78 56 50 77 Z' fill='%23ecd9a6'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gold-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ebc6" />
      <stop offset=".55" stop-color="#dcbb72" />
      <stop offset="1" stop-color="#b98f42" />
    </linearGradient>
    <symbol id="wax-seal" viewBox="0 0 100 100">
      <g fill="#7c141b">
        <circle cx="51" cy="53" r="45" />
        <circle cx="13" cy="42" r="9" /><circle cx="88" cy="64" r="8" />
        <circle cx="62" cy="92" r="8" /><circle cx="30" cy="89" r="7" />
      </g>
      <g fill="#a51e27">
        <circle cx="50" cy="50" r="45" />
        <circle cx="12" cy="39" r="9" /><circle cx="87" cy="61" r="8" />
        <circle cx="61" cy="89" r="8" /><circle cx="29" cy="86" r="7" />
      </g>
      <circle cx="50" cy="50" r="33" fill="#941a22" />
      <circle cx="50" cy="50" r="33" fill="none" stroke="#7c141b" stroke-width="2" />
      <path d="M24 38 A30 30 0 0 1 46 21" fill="none" stroke="#c9434c" stroke-width="3" stroke-linecap="round" opacity=".7" />
      <path id="seal-heart" d="M50 67 C34 55 31 46 36 40 C41 34 48 37 50 43 C52 37 59 34 64 40 C69 46 66 55 50 67 Z" fill="#7c141b" />
      <text id="seal-initials" x="50" y="61" text-anchor="middle" font-family="'IM Fell English SC', serif" font-size="30" fill="#7c141b"></text>
    </symbol>
  </defs>
</svg>

<!-- 0. Heart: press and hold to fill it -->
<section class="scene" id="heart" hidden>
  <div class="heart">
    <button class="heart__button" id="heart-button" type="button" aria-describedby="heart-cue" aria-label="Heart">
      <svg viewBox="0 0 200 184" aria-hidden="true">
        <defs>
          <clipPath id="heart-clip"><path d="M100 172 C40 124 10 92 10 56 C10 28 32 10 56 10 C74 10 90 20 100 36 C110 20 126 10 144 10 C168 10 190 28 190 56 C190 92 160 124 100 172 Z" /></clipPath>
          <linearGradient id="heart-liquid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d63548" /><stop offset=".5" stop-color="#a51e27" /><stop offset="1" stop-color="#7c141b" />
          </linearGradient>
        </defs>
        <path d="M100 172 C40 124 10 92 10 56 C10 28 32 10 56 10 C74 10 90 20 100 36 C110 20 126 10 144 10 C168 10 190 28 190 56 C190 92 160 124 100 172 Z" fill="#3a080c" />
        <g clip-path="url(#heart-clip)">
          <g id="heart-level">
            <path class="heart__wave heart__wave--back" d="M-200 0 Q-175 -8 -150 0 T-100 0 T-50 0 T0 0 T50 0 T100 0 T150 0 T200 0 T250 0 T300 0 T350 0 T400 0 V270 H-200 Z" fill="#8f1820" transform="translate(50 -3)" />
            <path class="heart__wave" d="M-200 0 Q-175 -8 -150 0 T-100 0 T-50 0 T0 0 T50 0 T100 0 T150 0 T200 0 T250 0 T300 0 T350 0 T400 0 V270 H-200 Z" fill="url(#heart-liquid)" />
          </g>
          <ellipse cx="58" cy="46" rx="24" ry="12" fill="#fff" opacity=".13" transform="rotate(-34 58 46)" />
        </g>
        <path d="M100 172 C40 124 10 92 10 56 C10 28 32 10 56 10 C74 10 90 20 100 36 C110 20 126 10 144 10 C168 10 190 28 190 56 C190 92 160 124 100 172 Z" fill="none" stroke="url(#gold-ink)" stroke-width="3.5" stroke-linejoin="round" />
      </svg>
    </button>
    <p class="heart__cue" id="heart-cue" role="status"></p>
  </div>
</section>

<!-- 1. Lock -->
<section class="scene" id="gate" hidden>
  <div class="gate">
    <h1 class="gate__title">Only for you</h1>
    <label class="gate__label" for="code-input">Enter our six-digit code</label>
    <div class="code" id="code">
      <div class="code__boxes" aria-hidden="true">
        <span class="code__box"></span><span class="code__box"></span><span class="code__box"></span>
        <span class="code__box"></span><span class="code__box"></span><span class="code__box"></span>
      </div>
      <input class="code__input" id="code-input" type="text" inputmode="numeric" pattern="[0-9]*"
             maxlength="6" autocomplete="off" aria-describedby="gate-hint gate-msg" />
    </div>
    <p class="gate__hint" id="gate-hint"></p>
    <p class="gate__msg" id="gate-msg" role="status"></p>
  </div>
</section>

<!-- 2. Envelope -->
<section class="scene" id="envelope" hidden>
  <div class="envelope">
    <p class="envelope__to" id="envelope-to"></p>
    <button class="env" id="env" type="button" aria-label="Open the envelope">
      <span class="env__part env__back"></span>
      <span class="env__part env__letter"></span>
      <span class="env__part env__front"></span>
      <span class="env__part env__flap"></span>
      <span class="env__seal">
        <span class="seal__half seal__half--l"><svg viewBox="0 0 100 100"><use href="#wax-seal" /></svg></span>
        <span class="seal__half seal__half--r"><svg viewBox="0 0 100 100"><use href="#wax-seal" /></svg></span>
      </span>
    </button>
    <p class="envelope__cue">Tap the seal to open</p>
  </div>
</section>

<!-- 3. Reveal -->
<section class="scene" id="reveal" hidden>
  <div class="reveal" id="reveal-inner">
    <svg class="reveal__script" id="reveal-script" role="img"></svg>
    <div class="reveal__after">
      <p class="reveal__sub" id="reveal-sub"></p>
      <p class="reveal__dates" id="reveal-dates"></p>
      <button class="btn" id="reveal-next" type="button">See what's inside</button>
    </div>
  </div>
</section>

<!-- 4. Menu -->
<section class="scene" id="menu" hidden>
  <div class="menu">
    <h2 class="menu__title">For you</h2>
    <nav class="gifts" aria-label="Your gifts">
      <a class="gift" href="#letter">
        <span class="gift__art">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <g transform="rotate(-12 60 60)">
              <rect x="22" y="30" width="72" height="50" rx="3" fill="#dfcba3" />
              <path d="M22 32 L58 58 L94 32" fill="none" stroke="#c4ab7d" stroke-width="2" />
            </g>
            <g transform="rotate(6 60 66)">
              <rect x="24" y="44" width="76" height="54" rx="3" fill="#f3e6cb" />
              <path d="M24 46 L62 76 L100 46" fill="#fbf3df" stroke="#dfcba3" stroke-width="2" stroke-linejoin="round" />
              <path d="M62 86 C54 80 52 75 55 72 C58 69 61 71 62 74 C63 71 66 69 69 72 C72 75 70 80 62 86 Z" fill="#a51e27" />
            </g>
          </svg>
        </span>
        <span class="gift__label">A letter</span>
      </a>
      <a class="gift" href="#flowers">
        <span class="gift__art" id="gift-bouquet"></span>
        <span class="gift__label">Flowers</span>
      </a>
      <a class="gift" href="#song">
        <span class="gift__art">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="50" fill="#1b0e0e" />
            <g fill="none" stroke="#3a2222" stroke-width="1.2">
              <circle cx="60" cy="60" r="44" /><circle cx="60" cy="60" r="38" />
              <circle cx="60" cy="60" r="32" /><circle cx="60" cy="60" r="26" />
            </g>
            <path d="M60 10 A50 50 0 0 1 103 35 L60 60 Z" fill="#fff" opacity=".07" />
            <circle cx="60" cy="60" r="19" fill="#a51e27" stroke="#c9a356" stroke-width="2" />
            <circle cx="60" cy="60" r="3.5" fill="#3a080c" />
          </svg>
        </span>
        <span class="gift__label">A song for you</span>
      </a>
      <a class="gift" href="#memories">
        <span class="gift__art gift__art--snaps" id="gift-snaps"></span>
        <span class="gift__label">Our memories</span>
      </a>
    </nav>
    <button class="link" id="replay" type="button">Play the opening again</button>
  </div>
</section>

<!-- 5. Letter -->
<section class="scene scene--page" id="letter" hidden>
  <div class="page">
    <div class="page__bar"><a class="back" href="#menu">Back</a></div>
    <div class="letter__photos" id="letter-photos"></div>
    <article class="sheet">
      <p class="sheet__greeting" id="letter-greeting"></p>
      <div class="sheet__body" id="letter-body"></div>
      <p class="sheet__signoff" id="letter-signoff"></p>
      <p class="sheet__name" id="letter-name"></p>
    </article>
  </div>
</section>

<!-- 6. Flowers -->
<section class="scene scene--page" id="flowers" hidden>
  <div class="page">
    <div class="page__bar"><a class="back" href="#menu">Back</a></div>
    <div class="bouquet-card">
      <div class="bouquet" id="bouquet"></div>
      <h2 class="bouquet-card__title">Flowers for you</h2>
    </div>
    <div class="flowers__action">
      <button class="btn" id="reason-next" type="button">Open the roses</button>
      <span class="flowers__count" id="reason-count" role="status"></span>
    </div>
    <ul class="reasons" id="reasons"></ul>
  </div>
</section>

<!-- 7. Song -->
<section class="scene scene--page" id="song" hidden>
  <div class="page">
    <div class="page__bar"><a class="back" href="#menu">Back</a></div>
    <div class="deck" id="deck" aria-hidden="true">
      <div class="deck__turntable">
        <div class="deck__platter"></div>
        <div class="vinyl">
          <svg class="vinyl__label" viewBox="0 0 100 100">
            <defs>
              <radialGradient id="label-wax" cx=".4" cy=".35" r=".8">
                <stop offset="0" stop-color="#c02b36" /><stop offset="1" stop-color="#7c141b" />
              </radialGradient>
              <path id="label-top" d="M14 50 A36 36 0 0 1 86 50" />
              <path id="label-bottom" d="M10 50 A40 40 0 0 0 90 50" />
            </defs>
            <circle cx="50" cy="50" r="50" fill="url(#label-wax)" />
            <circle cx="50" cy="50" r="47" fill="none" stroke="#c9a356" stroke-width=".8" />
            <circle cx="50" cy="50" r="26" fill="none" stroke="#c9a356" stroke-width=".5" opacity=".7" />
            <text font-family="'IM Fell English SC', serif" font-size="9.5" letter-spacing="1.4" fill="#ecd9a6" text-anchor="middle"><textPath href="#label-top" startOffset="50%" id="label-title"></textPath></text>
            <text font-family="'IM Fell English', serif" font-style="italic" font-size="7.5" fill="#ecd9a6" text-anchor="middle"><textPath href="#label-bottom" startOffset="50%" id="label-artist"></textPath></text>
            <text x="50" y="41" text-anchor="middle" font-family="'Pinyon Script', cursive" font-size="13" fill="#ecd9a6">for you</text>
            <text x="50" y="66" text-anchor="middle" font-family="'IM Fell English', serif" font-size="5.6" fill="#ecd9a6" id="label-line"></text>
            <circle cx="50" cy="50" r="3.8" fill="#08080a" />
          </svg>
        </div>
        <div class="vinyl__sheen"></div>
        <div class="vinyl__pin"></div>
      </div>
      <svg class="deck__arm" viewBox="0 0 100 82">
        <defs>
          <linearGradient id="arm-metal" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8b8b94" /><stop offset=".45" stop-color="#f1f1f4" /><stop offset="1" stop-color="#7d7d86" />
          </linearGradient>
          <linearGradient id="arm-dark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#17171a" /><stop offset=".5" stop-color="#4a4a52" /><stop offset="1" stop-color="#17171a" />
          </linearGradient>
        </defs>
        <g transform="translate(90 12)">
          <circle r="7.5" fill="#1d1d21" stroke="#4d4d55" stroke-width=".6" />
          <g class="tonearm">
            <g class="tonearm__bob">
              <rect x="-3.4" y="-14" width="6.8" height="8" rx="1.4" fill="url(#arm-dark)" />
              <rect x="-.9" y="-7" width="1.8" height="50" rx=".9" fill="url(#arm-metal)" />
              <path d="M2.6 45.5 L6.4 43.8" stroke="url(#arm-metal)" stroke-width=".9" stroke-linecap="round" />
              <rect x="-2.7" y="42" width="5.4" height="10" rx="1.1" fill="#121214" />
              <rect x="-2.7" y="42" width="5.4" height="1.6" rx=".8" fill="#5a5a63" />
              <circle r="3.4" fill="url(#arm-metal)" stroke="#6b6b74" stroke-width=".4" />
              <circle r="1.1" fill="#2a2a2f" />
            </g>
          </g>
        </g>
      </svg>
    </div>
    <h2 class="song__title" id="song-title"></h2>
    <p class="song__artist" id="song-artist"></p>
    <div class="song__frame" id="song-frame"><div id="song-player"></div></div>
    <p class="song__note" id="song-note"></p>
  </div>
</section>

<!-- 8. Memories -->
<section class="scene scene--page" id="memories" hidden>
  <div class="page">
    <div class="page__bar"><a class="back" href="#menu">Back</a></div>
    <h2 class="page__title">Our memories</h2>
    <div class="tabs" id="tabs" role="group" aria-label="Photo albums"></div>
    <div class="wall" id="wall"></div>
    <p class="wall__empty" id="wall-empty" hidden>The photos could not be loaded. Check the connection and open this page again.</p>
  </div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" hidden>
  <button class="lightbox__btn lightbox__btn--close" id="lightbox-close" type="button" aria-label="Close">&times;</button>
  <button class="lightbox__btn lightbox__btn--prev" id="lightbox-prev" type="button" aria-label="Previous photo">&#8249;</button>
  <img class="lightbox__img" id="lightbox-img" src="" alt="" />
  <button class="lightbox__btn lightbox__btn--next" id="lightbox-next" type="button" aria-label="Next photo">&#8250;</button>
</div>

<button class="rose-cover" id="rose-cover" type="button" hidden>
  <canvas></canvas>
  <span class="rose-cover__cue">Tap to reveal</span>
</button>

<div id="petal-field" aria-hidden="true"></div>

<script src="content.js?v=10"></script>
<script src="app.js?v=12"></script>
</body>
</html>
